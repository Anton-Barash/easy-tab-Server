name: Deploy Backend to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy backend to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # set -e: любая ошибка = красный workflow. Без этого падение
          # git pull было невидимым: npm/pm2 шли по старому коду, и деплой
          # выглядел «зелёным», хотя сервер не обновился (случай 20.08:
          # workflow success, а на сервере остался старый бандл).
          set -e
          cd ~/easy_tab_Server
          # fetch + checkout origin/main вместо pull: сервер — это deploy-target,
          # рабочая копия должна быть точной копией origin/main. pull
          # молча абортируется при любых локальных изменениях на сервере,
          # а checkout --force принудительно приводит код к origin/main.
          # Важно: папка web/ исключена (':(exclude)web') — туда фронт кладётся
          # SCP-ом (deploy-web.yml), и git-сброс не должен его затирать.
          git fetch origin main
          # Один раз снимаем web/ с git-индекса на сервере (до этого папка
          # отслеживалась). На свежем клоне папка уже не в git — команда
          # просто завершится ошибкой, которую мы игнорируем.
          git rm -r --cached web 2>/dev/null || true
          git checkout --force origin/main -- . ':(exclude)web'
          npm install
          # startOrReload: работает и при первом запуске, и при рестарте.
          # --update-env: подхватывает новые переменные из ecosystem.config.js.
          pm2 startOrReload ecosystem.config.js --env production --update-env
          echo "Backend deployment completed successfully"
