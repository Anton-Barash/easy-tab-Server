name: Deploy Backend to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend
      uses: actions/checkout@v4

    - name: Prepare server directory (remove stale .git)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # Старый деплой использовал git pull/reset, поэтому на сервере осталась
          # папка .git с защищёнными правами. SCP не может перезаписать её.
          # Теперь деплой идёт через SCP из GitHub Actions — .git больше не нужна.
          rm -rf ~/easy_tab_Server/.git

    - name: Deploy backend sources to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        use_insecure_cipher: true
        source: "./"
        target: "~/easy_tab_Server/"
        overwrite: true
        # Не копировать на сервер то, что там уже есть или не нужно:
        # node_modules — ставится npm install,
        # .env* — секреты сервера, uploads/logs — пользовательские данные,
        # web — сборка фронта, доставляемая отдельным workflow.
        # .git — не нужен на сервере (деплой идёт через SCP, а не git).
        # ВАЖНО: rm: true нельзя использовать, иначе SCP сначала полностью
        # удалит target-папку, включая .env.production, uploads/, logs/ и web/.
        exclude: ".git/,**/.git/**,node_modules/,.env,.env.production,uploads/,logs/,web/"

    - name: Restart backend on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          set -e
          cd ~/easy_tab_Server
          # web/ — это сборка фронта, доставляемая отдельным workflow.
          # Если папка отсутствует (первый деплой), создаём пустую,
          # чтобы сервер мог стартовать.
          mkdir -p web
          npm install
          # startOrReload: работает и при первом запуске, и при рестарте.
          # --update-env: подхватывает новые переменные из ecosystem.config.js.
          pm2 startOrReload ecosystem.config.js --env production --update-env
          echo "Backend deployment completed successfully"
