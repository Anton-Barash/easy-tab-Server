name: Deploy Backend to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout backend
      uses: actions/checkout@v4

    - name: Deploy backend sources to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        use_insecure_cipher: true
        source: "./"
        target: "~/easy_tab_Server/"
        overwrite: true

    - name: Restart backend on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          set -e
          cd ~/easy_tab_Server
          # web/ — это сборка фронта, доставляемая отдельным workflow.
          # Если папка отсутствует (первый деплой), создаём пустую,
          # чтобы сервер мог стартовать.
          mkdir -p web
          npm install
          # startOrReload: работает и при первом запуске, и при рестарте.
          # --update-env: подхватывает новые переменные из ecosystem.config.js.
          pm2 startOrReload ecosystem.config.js --env production --update-env
          echo "Backend deployment completed successfully"
